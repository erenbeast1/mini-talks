     Only the Mini-Events dropdown changes. Everything else in the
     Elementor HTML widget stays exactly as it is.

     The four categories and the special days are not pages of their
     own: they are views of the page that carries [mini_events], which
     is /mini-events/mini-calendar/. So each one is that page with a
     ?view= on the end, and the view name is the page title, slugified.

     "Why Mini-Events" and "Mini-Calendar" keep the addresses they
     already have.

     The old short addresses (?view=workshops, ?view=meetups,
     ?view=experts, ?view=updates, ?view=special-days) still work —
     they redirect to the long ones — so any link already out in the
     world is safe.
     ============================================================ -->
