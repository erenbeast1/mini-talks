<form class="mfe-host-fields" id="mfe-host-form" novalidate><!-- Event Type --><div class="mfe-host-typegrid">{{type_cards}}</div><!-- Row 1: Name, Email --><div class="mfe-host-row"><div class="mfe-host-field"><label>Full Name <span class="req">*</span></label><input type="text" name="full_name" class="inp-red" required value="{{prefill_name}}" /></div><div class="mfe-host-field"><label>Email <span class="req">*</span></label><input type="email" name="email" class="inp-blue" required value="{{prefill_email}}" /></div></div><!-- Row 2: City, Preferred Date --><div class="mfe-host-row"><div class="mfe-host-field"><label>City</label><input type="text" name="city" class="inp-green" placeholder="e.g. Izmir" /></div><div class="mfe-host-field"><label>Preferred Date</label><input type="date" name="preferred_date" class="inp-yellow" /></div></div><!-- Location --><div class="mfe-host-field full"><label>Location / Venue</label><input type="text" name="location_name" class="inp-red" placeholder="Venue name or address" /></div><!-- Description --><div class="mfe-host-field full"><label>Brief Description <span class="req">*</span></label><textarea name="proposal_text" required placeholder="What would you like to organize? Who is it for? Any details that help us understand."></textarea></div><!-- Talk-Spot conditional --><div class="mfe-host-talkspot" style="display:none"><div class="mfe-host-row"><div class="mfe-host-field"><label>Venue Type</label><input type="text" name="venue_type" class="inp-yellow" placeholder="cafe, school, community center..." /></div></div><div class="mfe-host-field full"><label>Space Notes</label><textarea name="space_notes" placeholder="Indoor/outdoor, capacity, accessibility, etc."></textarea></div></div><!-- Submit (mw-btn-brick pattern, no heart) --><div class="mfe-host-btnwrap"><button class="mfe-host-brick-btn" type="submit"><span class="mfe-host-brick-stud" aria-hidden="true"></span><div class="mfe-host-brick-topbar"></div><div class="mfe-host-brick-inner"><span>Send Request</span></div></button></div><div class="mfe-host-status" id="mfe-host-status"></div><div class="mfe-host-disclaimer"><p>Mini-Talks reviews each request before publishing.<br>We will reach out by email when a decision is made.</p></div></form>
