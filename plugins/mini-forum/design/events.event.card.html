<div class="mfe-frame-card" data-event-id="{{event_id}}" data-month-key="{{month_key}}" data-date-key="{{date_key}}" data-is-upcoming="{{is_upcoming}}"><div class="mfe-frame-studs mfe-stud-{{colour}}"></div><div class="mfe-frame-body mfe-frame-{{colour}}"><div class="mfe-frame-inner"><div class="mfe-evcard-img mfe-evcard-img-has mfe-evcard-img-bdr-{{colour}}"><img src="{{image}}" alt="" /><div class="mfe-datebox mfe-db-{{colour}} mfe-db-noborder" style="position:absolute;top:12px;left:12px"><span class="mfe-d-day">{{day}}</span><span class="mfe-d-num">{{date}}</span><span class="mfe-d-mon">{{month}}</span></div></div><div class="mfe-evcard-body"><h3 class="mfe-evcard-title">{{title}}</h3>{{meta}}<span class="mfe-evcard-sep"></span><p class="mfe-evcard-desc">{{description}}</p><div class="mfe-evcard-foot"><div class="mfe-evcard-avatars" data-event-id="{{event_id}}">{{avatars}}</div></div>{{buttons}}</div></div></div></div>
