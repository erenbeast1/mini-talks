<div class="mf-create-frame" style="background:{{frame_colour}}"><div class="mf-create-body"><!-- Side color bars (behind card) --><div class="mf-create-sides left" style="background:#E52828"></div><div class="mf-create-sides right" style="background:#0055BF"></div><input type="hidden" id="mf-create-type" value="{{type}}" /><div class="mf-field-group"><label>Title</label><input type="text" id="mf-create-title" placeholder="{{title_placeholder}}" /></div><div class="mf-field-group"><label>What would you like to share?</label><textarea id="mf-create-content" rows="5" placeholder="{{body_placeholder}}"></textarea></div><!-- Topic — dropdown/select style --><div class="mf-field-group"><label>Choose a topic <span class="mf-optional">(optional)</span></label><select id="mf-create-topic" class="mf-topic-select"><option value="">Select a topic...</option><option value="family">With Family</option><option value="school">At School</option><option value="social">In Social Settings</option><option value="mini-talks">Mini-Talks</option></select></div><!-- Emotional tags --><div class="mf-field-group"><label>How would you describe this moment? <span class="mf-optional">(optional)</span></label><div class="mf-tag-chips">{{tags}}</div></div><!-- Safety Note --><div class="mf-safety-note-v2"><div class="mf-safety-shield">🛡</div><span><strong>Safety Note:</strong> Feel free to keep things general — no need to share personal details.</span></div><div id="mf-create-error" class="mf-auth-error"></div><div class="mf-form-actions"><a href="{{forum_url}}" class="mf-btn mf-btn-cancel">Cancel</a><button class="mf-btn mf-btn-blue" data-mf-action="post-share">Share</button></div></div></div>
