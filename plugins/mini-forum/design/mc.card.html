<article class="me-card" data-image="{{image}}" data-subtitle="{{subtitle}}"><div class="me-event-frame"><div class="me-event-inner"><div class="me-card-top"><div class="me-date-badge" data-month="{{mon}}" data-day="{{day}}" data-year="{{year}}"><span class="me-badge-year">{{year}}</span><span class="me-badge-body"><b>{{day}}</b><span class="me-badge-month">{{mon}}</span></span></div><h3>{{title}}</h3></div><p class="me-meta">{{meta}}</p><p class="me-desc">{{description}}</p><div class="me-full-details" hidden>{{details}}</div><div class="me-card-bottom"><button class="me-btn" data-detail="{{title}}">See Details</button><span class="me-status">{{status}}</span></div></div></div></article>
