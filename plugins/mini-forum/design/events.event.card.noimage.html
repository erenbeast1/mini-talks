<div class="mfe-frame-card mfe-frame-card-noimg" data-event-id="{{event_id}}" data-month-key="{{month_key}}" data-date-key="{{date_key}}" data-is-upcoming="{{is_upcoming}}"><div class="mfe-frame-studs mfe-stud-{{colour}}"></div><div class="mfe-frame-body mfe-frame-{{colour}}"><div class="mfe-frame-inner"><div class="mfe-evcard-body"><div class="mfe-evcard-headerow"><div class="mfe-datebox mfe-db-{{colour}}"><span class="mfe-d-day">{{day}}</span><span class="mfe-d-num">{{date}}</span><span class="mfe-d-mon">{{month}}</span></div><h3 class="mfe-evcard-title mfe-evcard-title-inline">{{title}}</h3></div>{{meta}}<span class="mfe-evcard-sep"></span><p class="mfe-evcard-desc">{{description}}</p><div class="mfe-evcard-foot"><div class="mfe-evcard-avatars" data-event-id="{{event_id}}">{{avatars}}</div></div>{{buttons}}</div></div></div></div>
