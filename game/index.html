<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Mini-Talks Game</title>

    <style>
      /* Tüm cihazlar — beyaz arka plan, status bar alanı blend olsun */
      html, body {
        margin: 0;
        padding: 0;
        background: #FFFFFF;
      }
      /* App.jsx bg-gray-50 status bar'da gri şerit yapıyor — override */
      #root {
        background: #FFFFFF;
      }

      /* 
        SADECE dokunmatik cihazlarda (mobil/tablet) sayfa scroll/zoom/bounce engeli.
        Desktop'ta hiçbir şey değişmez, iç scroll'lar normal çalışır.
      */
      @media (hover: none) and (pointer: coarse) {
        html {
          overflow: hidden;
          overscroll-behavior: none;
          position: fixed;
          width: 100%;
          height: 100%;
          -webkit-text-size-adjust: 100%;
          text-size-adjust: 100%;
        }
        body {
          overflow: hidden;
          overscroll-behavior: none;
          position: fixed;
          width: 100%;
          height: 100%;
          touch-action: manipulation;
        }
        #root {
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
      }
    </style>

    <script>
      // Sadece dokunmatik cihazlarda çalışsın
      var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

      if (isTouch) {
        // iOS Safari pinch-to-zoom engelle
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
        document.addEventListener('gestureend', function (e) { e.preventDefault(); });

        // Çift parmak zoom engelle, tek parmak iç scroll'a dokunma
        document.addEventListener('touchmove', function (e) {
          if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        // iOS safe area recalculation — ilk yüklemede yanlış hesaplamayı düzelt
        window.addEventListener('load', function () {
          setTimeout(function () {
            window.scrollTo(0, 0);
            window.dispatchEvent(new Event('resize'));
          }, 100);
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
